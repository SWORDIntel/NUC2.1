[workspace]
resolver = "2"
members = [
    "movidius-ncapi",
    "movidius-hal",
    "movidius-bench",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jules <jules@swordlabs.ai>"]
repository = "https://github.com/SWORDIntel/NUC2.1"

[workspace.dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

# Async and concurrency
tokio = { version = "1.35", features = ["full"] }
io-uring = "0.6"
crossbeam = "0.8"
parking_lot = "0.12"

# SIMD and performance
half = { version = "2.3", features = ["bytemuck"] }
bytemuck = { version = "1.14", features = ["derive", "extern_crate_alloc"] }
cache-padded = "1.3"

# Zero-copy and serialization
zerocopy = { version = "0.7", features = ["derive"] }
memmap2 = "0.9"
bincode = "1.3"
atomic = "0.6"
crossbeam-utils = "0.8"

# System interfaces
libc = "0.2"
nix = { version = "0.27", features = ["ioctl", "mman"] }

# Profiling and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI
ratatui = "0.26"
crossterm = "0.27"

# FFI
cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 1
